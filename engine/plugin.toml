# tb.ants -- the reference cartridge.
#
# A game: its rules, its world generation, its scoring and its replay format, as a signed
# WebAssembly component the platform loads, versions and executes in a sandbox. The competitor
# guide's *Adding a game* is the contract a cartridge meets; the rules are the rules of Ants in the
# same book.
#
# Note `replay-decode`: Orion refuses a plugin function label that is not [a-z][a-z0-9-]*, so the
# `replay_decode` spelling does not load at all.
abi = "orion:plugin@1.0.0"
name = "tb.ants"
version = "1.0.0"
component = "tb-ants.wasm"

[[functions]]
name = "tb.ants.worldgen"
description = "Build a wave of worlds: one seed per match, and the board each is played on"
category = "transform"

[[functions.input_fields]]
name = "seeds"
description = "One seed per match in the wave, in the claim's order"
kind = "array"
required = true
template_at = true

[[functions.input_fields]]
name = "players"
description = "Optional check: the map carries the seat count and refuses a caller that disagrees"
kind = "number"
required = false
template_at = true

# A board is REQUIRED, as `map` or as `maps` -- the component carries none (N28) -- but neither
# field alone is, so both are declared optional and worldgen refuses a call with neither as NO_MAP.
[[functions.input_fields]]
name = "map"
description = "The board, whole, for every match in the wave -- required unless `maps` gives one per seed"
kind = "object"
required = false
template_at = true

[[functions.input_fields]]
name = "maps"
description = "One board per seed, positionally, whole; a null there falls back to `map`"
kind = "array"
required = false
template_at = true

[[functions.input_fields]]
name = "max_turns"
description = "The turn limit; the manifest's limits.max_turns, defaulting to 1000"
kind = "number"
required = false
template_at = true

[[functions]]
name = "tb.ants.observe"
description = "Every live seat's view of every live match; nothing for a match that has ended"
category = "transform"

[[functions.input_fields]]
name = "wave_state"
description = "The opaque state the last call returned"
kind = "string"
required = true
template_at = true

[[functions.input_fields]]
name = "refs"
description = "Opaque per-seat handles carrying m and seat, echoed onto each view and never inspected"
kind = "array"
required = false
template_at = true

[[functions]]
name = "tb.ants.step"
description = "Advance every live match in the wave by one turn"
category = "transform"

[[functions.input_fields]]
name = "wave_state"
kind = "string"
required = true
template_at = true

[[functions.input_fields]]
name = "actions"
description = "Positionally aligned with the last observe, or explicit { m, seat, action } entries"
kind = "array"
required = true
template_at = true

[[functions]]
name = "tb.ants.finish"
description = "Ranks, scores and an end reason for every match in the wave"
category = "transform"

[[functions.input_fields]]
name = "wave_state"
kind = "string"
required = true
template_at = true

[[functions]]
name = "tb.ants.replay-decode"
description = "Frames of a replay payload, re-simulated from the action stream, for the viewer"
category = "transform"

[[functions.input_fields]]
name = "payload"
description = "The replay envelope, which carries the board it was played on"
kind = "object"
required = true
template_at = true

# Relaxed from required, which a workflow cannot break -- the refusal is on a field becoming newly
# REQUIRED. `from`/`to` name a range instead, so a scrubber walks the match once rather than
# re-simulating it from turn zero for every frame it draws.
[[functions.input_fields]]
name = "turn"
description = "One frame, by turn. Ignored when from or to is given"
kind = "number"
required = false
template_at = true

[[functions.input_fields]]
name = "from"
description = "First turn of a range of frames, inclusive"
kind = "number"
required = false
template_at = true

[[functions.input_fields]]
name = "to"
description = "Last turn of a range of frames, inclusive"
kind = "number"
required = false
template_at = true
