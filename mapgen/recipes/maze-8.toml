# A maze of rooms five across, walls one thick, a fifth of the extra doors open.
# Design run 14 of 16 (L16 orthogonal array): seats 7-8 -> 8, terrain maze,
# board small (80x80, 800 squares a seat), 1 hill a seat, lean food.
[preset]
name = "maze-8"
seats = 8
count = 4
seed = 2026091814

[board]
rows = 80
cols = 80
shifts = ["diagonal", "rows", "cols"]

[areas]
size = [25, 25]
grid = true
closure_pct = 100
wall = 1

[connectivity]
loops_pct = 20

[hills]
per_seat = 1
room = true
home_doors_min = 2

[food]
per_seat = 8
bootstrap = 2
bootstrap_walk = [2, 8]
