# basic-small-3p: a small board, cave terrain, 3 seats, 1 hill a seat.
# The "grotto" family under point group d2x, 36x36, seat shift (12, 12).
# Drawn by `mapgen explore` (candidate 15) and picked by eye. A design is
# data: the renderer draws exactly this, whatever becomes of the sampler that proposed it.

