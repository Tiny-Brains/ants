# A tight maze of rooms three across joined by a tree: one route between any two.
# Design run 10 of 16 (L16 orthogonal array): seats 5-6 -> 6, terrain maze,
# board huge (144x144, 3456 squares a seat), 3 hills a seat, rich food.
[preset]
name = "maze-6"
seats = 6
count = 4
seed = 2026091810

[board]
rows = 144
cols = 144
shifts = ["diagonal", "rows", "cols"]

[areas]
size = [9, 9]
grid = true
closure_pct = 100
wall = 1

[connectivity]
loops_pct = 0

[hills]
per_seat = 3
room = true
home_doors_min = 2

[food]
per_seat = 36
bootstrap = 4
bootstrap_walk = [2, 8]
