# mapgen -- the board factory. It writes the basic boards under ../maps/ from the recipes under
# recipes/ -- and a season's boards wherever --recipes and --maps point, which is never this
# repository -- and proves every board is still what its recipe makes.
#
# A crate of its own, not a binary of the engine's, for one reason: the component is built from
# engine/src/, and every edit there is a new engine digest. Tuning how boards are made is not a
# rules change, so it must not look like one. Nor are the boards themselves: the component carries
# none, and a board reaches worldgen whole from whoever holds it.
#
# It depends on the engine for the one thing it must not reimplement: `tb.ants.worldgen`, which is
# the validation every board passes before a match is played on it.
[package]
name = "tb-ants-mapgen"
version = "1.0.0"
edition = "2024"
publish = false

[dependencies]
tb-ants = { path = "../engine" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Generation is a few million integer operations a board; unoptimised, `cargo test` and `check`
# would spend minutes on what takes seconds.
[profile.dev]
opt-level = 2

[workspace]
