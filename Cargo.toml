# The Ants cartridge: the reference game, shipped as a signed WebAssembly component the platform
# loads, versions and executes in a sandbox.
#
# The contract is docs/cartridge.md and what a model sees is docs/protocol.md; where this crate and
# those documents disagree, they are right and this is a bug. Two properties are load-bearing and
# are tested rather than intended: no floating point anywhere in game logic, so the platform's build
# and the browser's agree bit for bit (`deny.sh` checks the source, because
# `#![forbid(clippy::float_arithmetic)]` is not a thing); and the same seed is the same match on
# every machine.
[package]
name = "tb-ants"
version = "1.0.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde_json = "1"

# Only the export shim needs the SDK, and its generated bindings do not build for the host -- so the
# dependency is wasm-only and the shim is behind the same cfg. Everything else in the crate is
# host-testable, which is where every rule of Ants is checked.
[target.'cfg(target_arch = "wasm32")'.dependencies]
orion-plugin-sdk = "1.7"

[profile.release]
opt-level = "s"
lto = true
panic = "abort"
codegen-units = 1
strip = true

[workspace]
