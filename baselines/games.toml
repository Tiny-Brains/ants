# The cartridge these baselines train against: the build output of the checkout they live in. The
# starter kit pins a published release of the same tree instead, and
# `tinybrains games` always reports which way it resolved. `../dist` needs `./build.sh` run there
# first -- the component, cartridge.json and reference/observations.json are not committed.
#
# THE ENGINE DIGEST IS PART OF EVERY MODEL CARD. A baseline trained against one engine and played
# under another is a baseline nobody can reproduce, which is why `tinybrains env` prints the digest
# in its first line and `export.py` writes it into the card.

[games.ants]
name = "Ants"
path = "../dist"
